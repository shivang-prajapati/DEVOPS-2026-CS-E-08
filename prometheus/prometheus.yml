global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'estatex-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000', 'host.docker.internal:3000']
        labels:
          app: 'estatex'
          env: 'devops'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
